<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Загрузка трамвайной сети</title>
    <link rel="stylesheet" href="./styles.css?v=20260927-equal" />
  </head>
  <body>
    <div class="app-shell dashboard-page">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">Т</div>
          <div>
            <p class="eyebrow">МОСТРАНСПОРТ · ПРОГНОЗ</p>
            <h1>Загрузка сети</h1>
          </div>
        </div>
        <nav class="page-nav" aria-label="Разделы">
          <a class="nav-link" href="./index.html">Карта</a>
          <a class="nav-link active" href="./dashboard.html">Дашборд</a>
          <a class="nav-link" href="/logout">Выйти</a>
        </nav>
        <div class="topbar-meta">
          <span class="live-dot"></span>
            <span>Открытые данные</span>
        </div>
      </header>
      <main class="workspace">
        <section class="panel-block forecast-panel">
          <p class="section-label">Прогноз</p>
          <h2>Ближайшие часы</h2>
          <div id="forecast-watch" class="rank-list"></div>
        </section>
        <section class="summary-row" id="summary"></section>
        <div class="dash-grid">
          <section class="panel-block">
            <h2>ДТП на километр</h2>
            <div id="ranking" class="rank-list"></div>
          </section>
          <section class="panel-block events-column">
            <h2>Аварии у остановок</h2>
            <div id="events" class="event-list"></div>
          </section>
          <section class="panel-block weather-column">
            <h2>Погода по маршрутам</h2>
            <div id="weather" class="weather-list"></div>
          </section>
          <section class="panel-block">
            <h2>Индекс заторов</h2>
            <div id="traffic" class="traffic-list"></div>
          </section>
          <section class="panel-block">
            <h2>Ремонты у линий</h2>
            <div id="production" class="event-list"></div>
          </section>
          <section class="panel-block">
            <h2>Остановки</h2>
            <div id="stations" class="station-list"></div>
          </section>
        </div>
        <section class="panel-block analytics-panel">
          <p class="section-label">Сводка</p>
          <h2>Аналитика сети</h2>
          <div class="analytics-grid">
            <div>
              <p class="demand-caption">Линии по плотности ДТП</p>
              <div id="load-mix" class="mix-list"></div>
            </div>
            <div>
              <p class="demand-caption">ДТП 2024–2026 на маршруте</p>
              <div id="network-hours" class="hour-chart network-chart"></div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="./demand.js?v=20260927-facts"></script>
    <script src="./facts.js?v=20260927-fleet"></script>
    <script src="./forecast.js?v=20260927-equal"></script>
    <script src="./dashboard.js?v=20260927-equal"></script>
  </body>
</html>
